name: trade-calendar

x-app-environment: &app-environment
  CALENDAR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-calendar}@db:5432/${POSTGRES_DB:-calendar}
  CALENDAR_ENVIRONMENT: ${CALENDAR_ENVIRONMENT:-development}
  CALENDAR_USER_TIMEZONE: ${CALENDAR_USER_TIMEZONE:-Asia/Shanghai}
  CALENDAR_SESSION_SECRET: ${CALENDAR_SESSION_SECRET:-development-only-change-me}
  CALENDAR_ICS_TOKEN: ${CALENDAR_ICS_TOKEN:-development-ics-token}
  CALENDAR_FEISHU_WEBHOOK_URL: ${CALENDAR_FEISHU_WEBHOOK_URL:-}
  CALENDAR_PUBLIC_BASE_URL: ${CALENDAR_PUBLIC_BASE_URL:-http://localhost:3000}
  CALENDAR_CONFIG_DIR: /app/config

x-app-env-files: &app-env-files
  - ../.env

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
      POSTGRES_USER: ${POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendar} -d ${POSTGRES_DB:-calendar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment: *app-environment
    env_file: *app-env-files
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    command: ["python", "/app/worker/main.py"]
    environment: *app-environment
    env_file: *app-env-files
    volumes:
      - longbridge_auth:/home/calendar/.longbridge/openapi
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_URL: http://api:8000
      # Must match the INTERNAL_API_SECRET the API reads from ../.env. Passed
      # explicitly (rather than via env_file) so the web container never receives
      # the database credentials.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # VPC connects to 127.0.0.1:8000 in the API network namespace, avoiding
    # stale Docker DNS addresses after a container or Docker Desktop restart.
    network_mode: "service:api"
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - cloudflared.env
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  postgres_data:
  longbridge_auth:
